<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verdict</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    position:relative;
    width:90%;
    max-width:380px;
}

#img{
    width:100%;
    display:block;
    border-radius:12px;
    transition:opacity 1s ease;
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:rgba(0,0,0,.30);
    color:#fff;
    padding:20px;
    border-radius:12px;
    transition:opacity 1s ease;
}

.heading{
    color:#FFD700;
    font-size:31px;
    font-weight:bold;
    letter-spacing:2px;
    margin-top:12px;
}

.guilty{
    color:#ff3030;
    font-size:38px;
    font-weight:900;
    text-shadow:
        0 0 8px red,
        0 0 18px red,
        0 0 30px red;
    margin-bottom:18px;
}

.text{
    font-size:17px;
    font-weight:bold;
    margin-bottom:10px;
}

.final{
    margin-top:18px;
    font-size:17px;
    color:#ddd;
    font-style:italic;
}

.fade{
    opacity:0;
}
</style>
</head>

<body>

<div class="container">

    <img id="img" src="your-image.jpg" alt="Verdict">

    <div id="overlay" class="overlay">
         
        <div class="heading">⚖️</div>

        <div class="heading">VERDICT</div>
        <div class="guilty">GUILTY</div>

        <div class="heading">CHARGE</div>
        <div class="text">Clicked "NO"</div>

        <div class="heading">SENTENCE</div>
        <div class="text">📸Send 100 Photos Now</div>
        <div class="text">📞2 Calls Every Month(At Least)</div>

        <div class="final">
            Judgment is Final.
        </div>

    </div>

</div>

<script>
const img = document.getElementById("img");
const overlay = document.getElementById("overlay");

// Fade out after 7 seconds 
setTimeout(() => {
    img.classList.add("fade");
    overlay.classList.add("fade");
}, 7000);

// Redirect after 8 seconds
setTimeout(() => {
    window.location.href = "https://yourboy15.my.canva.site/";
}, 8000);
</script>

</body>
</html>
